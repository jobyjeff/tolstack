<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tolstack — stack viewer</title>
  <style>
    :root {
      --bg: #16181d; --panel: #1e2128; --panel2: #12141a; --ink: #e6e8ec;
      --muted: #9aa1ac; --accent: #6ea8fe; --on: #2b6cb0; --line: #2b2f38;
      /* The provenance palette. These three are the whole point of the app, so
         they are the only saturated colours on the page — everything else is
         grey. traced = green, inferred = amber, untraced = red, and a missing
         citation is magenta because it is worse than admitting "untraced". */
      --traced: #43a047; --inferred: #d98a00; --untraced: #e05252;
      --nocite: #c355c3;
      --zero: #7aa7d6;   /* zero-width bands: a distinct axis, not a confidence */
      --fail: #e05252; --marginal: #d98a00; --pass: #43a047;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
    }
    code, .num { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    h1 { font-size: 18px; margin: 0; }
    h2 { font-size: 17px; margin: 0 0 4px; }
    h3 { font-size: 15px; margin: 22px 0 8px; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); }
    .muted { color: var(--muted); font-size: 13px; }
    a { color: var(--accent); }

    .topbar {
      display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
      padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
      position: sticky; top: 0; z-index: 5;
    }
    .topbar .sub { color: var(--muted); font-size: 12px; }
    .topbar__spacer { flex: 1; }

    button {
      background: var(--accent); color: #0b1020; border: 0; border-radius: 6px;
      padding: 6px 11px; font: inherit; font-weight: 600; cursor: pointer;
    }
    button.ghost, .banner__action { background: #363b45; color: var(--ink); }

    .banner {
      padding: 8px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      border-bottom: 1px solid var(--line); background: var(--panel2); font-size: 13px;
    }
    .banner--disconnected { border-bottom-color: var(--accent); }
    .banner--needs-regrant { border-bottom-color: var(--inferred); }
    .banner__action { margin-left: auto; }
    .banner__error { flex-basis: 100%; color: var(--untraced); }
    .banner__built { color: var(--muted); font-variant-numeric: tabular-nums; }
    .banner__missing { flex-basis: 100%; border-left: 3px solid var(--inferred); padding: 6px 10px; }
    /* Which tree built each projection. Quiet by default — it is context, not an
       alarm — but the alarm above it is loud, because a projection built from a
       superseded branch looked exactly like a current one for six hours. */
    .banner__provenance {
      flex-basis: 100%; color: var(--muted); font-size: 12px;
      font-variant-numeric: tabular-nums; word-break: break-all;
    }
    .banner__stale {
      flex-basis: 100%; border-left: 3px solid var(--untraced); padding: 6px 10px;
      background: rgba(0, 0, 0, 0.15);
    }
    .banner__stale-head { color: var(--untraced); font-weight: 600; }
    .banner__stale-list { margin: 4px 0 6px; padding-left: 20px; }
    .banner__cmd, .croppop__cmd {
      display: inline-block; margin-top: 5px; background: var(--bg);
      padding: 3px 7px; border-radius: 4px; font-size: 12px; color: var(--ink);
    }

    main { display: flex; align-items: flex-start; gap: 0; }

    /* --- stack list ------------------------------------------------------ */
    .stacklist {
      width: 290px; flex: none; padding: 10px; border-right: 1px solid var(--line);
      display: flex; flex-direction: column; gap: 6px;
      position: sticky; top: 47px; max-height: calc(100vh - 47px); overflow: auto;
    }
    .stacklist__row {
      background: var(--panel); color: var(--ink); border: 1px solid var(--line);
      border-radius: 8px; padding: 9px 10px; text-align: left; font-weight: 400;
      display: block; width: 100%;
    }
    .stacklist__row--on { border-color: var(--accent); background: #202634; }
    .stacklist__id { font-family: ui-monospace, monospace; font-size: 12px; color: var(--accent); }
    .stacklist__title { margin: 3px 0 6px; font-size: 13px; }
    .stacklist__chips, .sv__chips { display: flex; flex-wrap: wrap; gap: 4px; }

    /* --- chips ----------------------------------------------------------- */
    .chip {
      font-size: 11px; padding: 1px 7px; border-radius: 10px;
      border: 1px solid var(--line); white-space: nowrap;
    }
    .conf--traced   { color: var(--traced);   border-color: var(--traced); }
    .conf--inferred { color: var(--inferred); border-color: var(--inferred); }
    /* untraced / no-citation are FILLED, not outlined: an untraced value has to
       be impossible to miss at a glance across a 30-row table. */
    .conf--untraced { color: #fff; background: var(--untraced); border-color: var(--untraced); font-weight: 700; }
    .conf--no_source_ref { color: #fff; background: var(--nocite); border-color: var(--nocite); font-weight: 700; }
    .conf--unknown { color: var(--muted); }
    .chip--kind { color: var(--muted); font-family: ui-monospace, monospace; }
    .chip--zero-width { color: var(--zero); border-color: var(--zero); border-style: dashed; }
    .chip--incomplete { color: #0b1020; background: var(--inferred); border-color: var(--inferred); font-weight: 700; }
    .chip--material { color: var(--accent); border-color: var(--accent); font-family: ui-monospace, monospace; }
    .chip--corner { color: var(--muted); border-style: dashed; }
    .chip--generated { color: var(--accent); border-color: var(--accent); }
    .chip--sensitivity { color: #0b1020; background: var(--marginal); border-color: var(--marginal); font-weight: 700; }
    /* A weighted term is monospaced so "+ 2.0010712 × sleeve_wall" lines up
       against its neighbours — the digits are the reason the chip exists. */
    .chip--weighted { font-family: ui-monospace, monospace; }
    .chip--gap-excluded_from_model { color: #fff; background: var(--untraced); border-color: var(--untraced); }
    .chip--gap-hardware_entry { color: var(--muted); }
    .verdict { font-weight: 700; text-transform: uppercase; }
    .verdict--pass { color: #fff; background: var(--pass); border-color: var(--pass); }
    .verdict--marginal { color: #0b1020; background: var(--marginal); border-color: var(--marginal); }
    .verdict--fail { color: #fff; background: var(--fail); border-color: var(--fail); }
    .verdict--unknown { color: var(--muted); }

    /* --- stack view ------------------------------------------------------ */
    .stackview { flex: 1 1 640px; min-width: 0; padding: 14px 18px 60px; }
    .sv__meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; margin-bottom: 6px; }
    .sv__joint { margin: 12px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
    .sv__joint summary { cursor: pointer; color: var(--muted); }
    .kv { display: grid; grid-template-columns: minmax(120px, 200px) 1fr; gap: 3px 14px; margin: 8px 0 2px; font-size: 13px; }
    .kv dt { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
    .kv dd { margin: 0; }
    .kv--tight { margin: 8px 0; }
    .plainlist { margin: 0; padding-left: 18px; }

    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px;
         text-transform: uppercase; border-bottom: 1px solid var(--line); padding: 4px 8px; }
    td { padding: 6px 8px; vertical-align: top; border-bottom: 1px solid var(--line); }
    .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    /* The topbar and banner are sticky, so anything scrolled to must leave room
       for them or it lands underneath and stops being clickable. */
    .el-row, .mat-row, .crop-trigger, .check, .gaplist li { scroll-margin-top: 120px; }

    /* Provenance tint on the whole row + a 3px spine in the confidence colour.
       The Materials table speaks the same language: a CTE nobody traced has to
       be as loud as an untraced length. */
    .el-row td:first-child, .mat-row td:first-child { border-left: 3px solid transparent; }
    .el-row.conf--traced   td:first-child,
    .mat-row.conf--traced  td:first-child { border-left-color: var(--traced); }
    .el-row.conf--inferred td:first-child,
    .mat-row.conf--inferred td:first-child { border-left-color: var(--inferred); }
    .el-row.conf--untraced td:first-child,
    .mat-row.conf--untraced td:first-child { border-left-color: var(--untraced); }
    .el-row.conf--no_source_ref td:first-child,
    .mat-row.conf--no_source_ref td:first-child { border-left-color: var(--nocite); }
    .el-row.conf--untraced, .mat-row.conf--untraced { background: rgba(224, 82, 82, .10); }
    .el-row.conf--no_source_ref,
    .mat-row.conf--no_source_ref { background: rgba(195, 85, 195, .12); }
    .el-row--zero-width .num--zero-width {
      color: var(--zero); border-bottom: 1px dashed var(--zero);
    }
    .el-row__name code { display: block; font-size: 11px; }
    .el-row__source { max-width: 340px; }
    .el-row__chips { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px; }
    .el-row__where { font-size: 12px; color: var(--ink); }
    .el-row__callout { font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace; margin-top: 3px; }
    /* Clamped by default (click to expand) — see views/stack.js. */
    .el-row__srcnote {
      font-size: 12px; color: var(--muted); margin-top: 3px; cursor: pointer;
      max-height: 4.6em; overflow: hidden; border-left: 2px solid var(--line); padding-left: 6px;
    }
    .el-row__srcnote--open { max-height: none; }
    .el-note td { color: var(--muted); font-size: 12px; padding-top: 0; border-bottom: 1px solid var(--line); }
    .el-note--gap td { color: var(--inferred); }
    .el-gaps summary { cursor: pointer; }
    .el-gaps ul { margin: 4px 0 2px; }

    .crop-trigger { margin-top: 6px; font-size: 12px; padding: 3px 9px; background: var(--on); color: #fff; }
    .crop-trigger--unresolvable, .crop-trigger--not-built, .crop-trigger--no-entry {
      background: transparent; color: var(--muted); border: 1px dashed var(--line);
    }

    .fold-row__label code { color: var(--accent); }
    .fold-note td { color: var(--zero); font-size: 12px; padding-top: 0; }

    .check {
      background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--line);
      border-radius: 8px; padding: 10px 12px; margin-bottom: 10px;
    }
    .check--incomplete { border-left-color: var(--inferred);
      background: repeating-linear-gradient(135deg, var(--panel), var(--panel) 10px, #23242a 10px, #23242a 20px); }
    /* A sensitivity probe is NOT a result: recessed and dashed so it reads as an
       aside beside the cards that are, however loud its verdict chip is. */
    .check--sensitivity { border-left-color: var(--marginal); border-style: dashed;
      opacity: .88; }
    .check__note { font-size: 12px; color: var(--accent); border: 1px dashed var(--accent);
      border-radius: 8px; padding: 8px 10px; margin: 0 0 10px; }
    .check__corner { display: flex; gap: 5px; flex-wrap: wrap; margin: 4px 0 6px; }
    .check__head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .check__id { margin-left: auto; color: var(--muted); font-size: 12px; }
    .check__label { margin: 6px 0; font-weight: 600; }
    .check__numbers { display: flex; gap: 16px; flex-wrap: wrap; margin: 8px 0; }
    .check__num { display: flex; flex-direction: column; }
    .check__numlabel { font-size: 10px; text-transform: uppercase; color: var(--muted); }
    .check__numvalue { font-family: ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .check__warn { color: var(--zero); font-size: 12px; margin: 4px 0; }
    .check__inputs { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
    .check__guidance { font-size: 13px; color: var(--muted); margin: 8px 0 0; }

    .gaplist, .notelist { margin: 0; padding-left: 0; list-style: none; }
    .gaplist li, .notelist li {
      background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
      padding: 8px 10px; margin-bottom: 6px; font-size: 13px;
    }
    .gap--excluded_from_model { border-left: 3px solid var(--untraced); }
    .gap__text { margin-left: 8px; }

    /* --- worksheet ------------------------------------------------------- */
    .worksheet {
      width: 520px; flex: none; border-left: 1px solid var(--line); background: var(--panel2);
      padding: 12px 16px 60px; position: sticky; top: 47px;
      max-height: calc(100vh - 47px); overflow: auto;
    }
    .worksheet__path { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; margin-bottom: 8px; }
    .worksheet__note { color: var(--muted); font-size: 11px; margin: -4px 0 8px; }
    .worksheet__body { font-size: 13px; overflow-wrap: anywhere; }
    .worksheet__body table { font-size: 12px; }
    .worksheet__body th, .worksheet__body td { border: 1px solid var(--line); padding: 3px 7px; }
    .worksheet__body code { background: var(--bg); padding: 1px 4px; border-radius: 3px; }
    .worksheet__body pre { background: var(--bg); padding: 8px; border-radius: 6px; overflow: auto; }
    .worksheet__body blockquote { margin: 8px 0; padding: 2px 12px; border-left: 3px solid var(--line); color: var(--muted); }
    .worksheet__body img { max-width: 100%; }

    /* --- crop popover ---------------------------------------------------- */
    .croppop {
      display: none; position: absolute; z-index: 20; width: 540px;
      background: var(--panel); border: 1px solid var(--accent); border-radius: 8px;
      padding: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.55);
    }
    .croppop--unresolvable, .croppop--not-built, .croppop--no-entry { border-color: var(--inferred); width: 400px; }
    .croppop__close { float: right; background: #363b45; color: var(--ink); padding: 1px 8px; margin-left: 6px; }
    .croppop__img { display: block; width: 100%; background: #fff; border-radius: 4px; }
    .croppop__head { font-weight: 600; margin-top: 6px; }
    .croppop__prov, .croppop__reason { color: var(--muted); font-size: 12px; margin: 4px 0; }
    .croppop__links { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
    .croppop__path { color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; margin-top: 4px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>tolstack — stack viewer</h1>
    <span class="sub">read-only · renders <code>data/projections/viewer/</code> · computes nothing</span>
    <span class="topbar__spacer"></span>
    <button id="worksheet-toggle" class="ghost">Hide worksheet</button>
  </div>
  <div id="banner" class="banner"></div>
  <main>
    <nav id="stacklist" class="stacklist"></nav>
    <section id="stackview" class="stackview"></section>
    <aside id="worksheet" class="worksheet"></aside>
  </main>
  <div id="croppop" class="croppop"></div>

  <!-- Classic scripts (NOT ES modules): the app must run by double-clicking from
       file://, where Chrome CORS-blocks cross-file `import`. Each file attaches
       to window.ViewerApp; app.js loads last and boots on DOMContentLoaded. -->
  <script src="./config.js"></script>
  <script src="./viewer.js"></script>
  <script src="./fixtures.js"></script>
  <script src="./vendor/markdown.js"></script>
  <script src="./storage/adapter.js"></script>
  <script src="./storage/memory.js"></script>
  <script src="./storage/fsa.js"></script>
  <script src="./views/dom.js"></script>
  <script src="./views/banner.js"></script>
  <script src="./views/list.js"></script>
  <script src="./views/stack.js"></script>
  <script src="./views/crop.js"></script>
  <script src="./views/worksheet.js"></script>
  <script src="./app.js"></script>
</body>
</html>
