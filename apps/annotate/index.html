<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tolstack — annotate</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="topbar">
    <h1>tolstack — annotate</h1>
    <span class="sub" id="transport-sub"></span>
    <span class="topbar__spacer"></span>
    <button id="connect-btn">Connect folder</button>
  </div>
  <div id="banner" class="banner"></div>

  <!-- The bind workspace, in one container ON PURPOSE: it is the whole of
       what this app can do, so a page that has just said it cannot annotate
       withholds it in one place (app.js's hosted branch) rather than hiding
       eight elements and forgetting the ninth. -->
  <main class="an" id="workspace">
    <aside class="an__rail">
      <label class="an__label">topology</label>
      <select id="topology-select"></select>
      <label class="an__label">study</label>
      <select id="study-select"></select>
      <!-- The rail's scope bar: what both panels below are filtered to, and
           the one control that lifts it. Empty and hidden until a
           `filter-element` sets a scope (app.js's renderRailFilter) -- an
           absent filter says nothing about filtering. -->
      <div id="rail-filter" class="an__filter" style="display:none"></div>
      <ol id="element-list" class="element-list"></ol>

      <!-- "parts (data/meshes/)" until 2026-09-18: a repo-relative path into
           a gitignored directory, as a label, on an always-visible panel --
           and in the flyout, where this app is embedded beside the viewer, a
           path the reader has no shell in which to look at. It wanted to say
           WHERE the meshes came from; this says it in everyday words.
           (ISSUE_20260917_the_annotators_console_and_parts_label_print_code_
           at_the_reader.) -->
      <label class="an__label">parts with a 3D model</label>
      <ul id="parts-panel" class="parts-panel"></ul>
    </aside>

    <section class="an__scene">
      <div id="canvas-host" class="an__canvas-host"></div>
      <div id="scene-empty" class="an__scene-empty" style="display:none"></div>
      <div class="an__console">
        <!-- The placeholder read `command, e.g. isolate machined_213668
             (window.AnnotateApp.exec)` until 2026-09-18, on a surface that is
             visible at rest with nothing selected. `window.AnnotateApp.exec`
             is an internal module path and `machined_213668` is a backend id
             a reader cannot know without reading code -- two standing
             web-UI rules, one placeholder. The list of commands this box
             actually accepts is put on its `title` at boot, read off the
             command registry itself (app.js), so it can never drift from what
             the box takes -- and an unknown command already answers with the
             same list. -->
        <input id="console-input" type="text" placeholder="command" />
        <button id="console-run">Run</button>
        <pre id="console-output"></pre>
      </div>
    </section>

    <aside id="detail" class="an__detail">Pick an element on the left, then click a face in the 3D view to bind it.</aside>
  </main>
  <!-- The one hover popup every consolidated alert badge on the rail shares.
       OUTSIDE #workspace and position: fixed (style.css) because the rail is a
       scrollport: a popup rendered inside a row would be clipped to 260px and
       a row near the bottom would open its popup below the fold. -->
  <div id="alert-pop" class="alertpop" style="display:none"></div>
  <div id="test-status" style="display:none"></div>

  <!-- Classic scripts, loaded in order -- window.AnnotateApp (AA) is built up
       synchronously so it's fully populated before the module script below
       (deferred by spec) runs. See scene.js's docstring for why this app,
       unlike apps/viewer, has no file:// constraint and can use ES modules
       at all. -->
  <!-- The SIBLING app's adapter contract, for one function: VA.chooseTransport
       (apps/viewer/storage/adapter.js) is where "may this page ask for a
       folder grant?" is decided for both apps, and a second copy of that
       answer is exactly the drift this repo keeps paying for. Resolves on both
       serving surfaces the apps have -- drawing-checker's mounts
       (/tolstack/annotate/ beside /tolstack/viewer/) and ops.toml's serve
       verb, which serves apps/ for this reason. -->
  <script src="../viewer/storage/adapter.js"></script>
  <script src="./config.js"></script>
  <script src="./storage/adapter.js"></script>
  <script src="./storage/memory.js"></script>
  <script src="./storage/fsa.js"></script>
  <script src="./binding_state.js"></script>
  <script src="./commands.js"></script>
  <script src="./exec_queue.js"></script>
  <script src="./fixtures.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js"
    }
  }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
