name = "tolstack"
main_branch = "master"

[paths]
sessions_root = "docs/sessions"
active = "docs/sessions/active"
completed = "docs/sessions/completed"
deferred = "docs/sessions/deferred"
prompts_dir = "docs/prompts"
issues = "docs/issues"

[roles]
tactical = "TACTICAL_AGENT.md"
strategy = "STRATEGY_AGENT.md"
review = "REVIEW_AGENT.md"
triage = "TRIAGE_AGENT.md"
orchestrator = "ORCHESTRATOR_AGENT.md"

[launch]
# agent_command: inherited from dispatch's default (claude --permission-mode auto).
# See dispatch/.dispatch.example.toml.
model = ""
seed_template = "Read {handoff_path} for instructions"
branch_prefix = "handoff/"
review_branch_prefix = "review/"

[worktrees]
enabled = true
root = "{repo_parent}/{repo}-worktrees"
dir_template = "{slug}"
remove_on_complete = true

[tests]
# Read-only [real]-tier inputs the merge candidate needs, each a gitignored
# directory that exists only in the main checkout. Measured at the 2026-10-21
# batch merge: `bridge-test-inputs` linked specs, drawings, tolerance_stacks and
# meshes, and reported data/inbox/feature-identity `present` (a fresh worktree
# carries its tracked README.md and nothing else there). linkage-sweeps was
# added that day (handoff the_kinematic_study_checks_its_run_its_units_and_
# shows_its_limit): the kinematic projection folds a sweep from it, and a
# candidate without it built the study as `error` and went 5 failed.
candidate_inputs = [
  "data/inbox/specs",
  "data/inbox/drawings",
  "data/inbox/feature-identity",
  "data/inbox/tolerance_stacks",
  "data/inbox/linkage-sweeps",
  "data/meshes",
]
