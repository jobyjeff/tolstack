name = "tolstack"
main_branch = "master"

[paths]
sessions_root = "docs/sessions"
active = "docs/sessions/active"
completed = "docs/sessions/completed"
deferred = "docs/sessions/deferred"
prompts_dir = "docs/prompts"
issues = "docs/issues"

[roles]
tactical = "TACTICAL_AGENT.md"
strategy = "STRATEGY_AGENT.md"
review = "REVIEW_AGENT.md"
triage = "TRIAGE_AGENT.md"
orchestrator = "ORCHESTRATOR_AGENT.md"

[launch]
# bypassPermissions: no permission prompts. See dispatch/.dispatch.example.toml.
agent_command = "claude --permission-mode bypassPermissions"
model = ""
seed_template = "Read {handoff_path} for instructions"
branch_prefix = "handoff/"
review_branch_prefix = "review/"

[worktrees]
enabled = true
root = "{repo_parent}/{repo}-worktrees"
dir_template = "{slug}"
remove_on_complete = true

[tests]
# Read-only [real]-tier inputs the merge candidate needs. Each is a tracked,
# placeholder-only directory in a fresh worktree (README.md/.gitkeep/
# PROVENANCE.md), so `bridge-test-inputs` reports every one of these as
# `present` rather than `linked` today -- see docs/sessions/lessons/
# LESSONS_20261001_declare_candidate_test_inputs.md and
# dispatch/docs/issues/ISSUE_20261001_bridge_test_inputs_cannot_arm_a_directory_that_carries_a_tracked_placeholder.md.
# The declaration stays, because it names the correct set and the moment that
# dispatch-side gap closes it starts working with no change here.
candidate_inputs = [
  "data/inbox/specs",
  "data/inbox/drawings",
  "data/inbox/feature-identity",
  "data/inbox/tolerance_stacks",
  "data/meshes",
]
