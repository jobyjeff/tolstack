[pytest]
# tmp/ holds the mutation-witness SHADOW TREE (scripts/run_mutation_witness_tests.mjs
# copies what the tiers read into tmp/mutation-witness-<pid>/, one directory per run
# since 2026-10-01, and patches the copy). Since 2026-09-18 that copy includes tests/,
# because the `python` tier runs pytest out of the shadow -- so without this line a
# bare `pytest -q` collects every test module twice and dies on the duplicate
# basenames before running anything.
#
# The trap that makes it worth a config file of its own: tmp/ is gitignored, so a
# fresh clone is green and the same tree goes red the moment somebody runs the
# mutation tier once. Nothing about the failure would point at the tier.
#
# The rest of this list is pytest's own default norecursedirs, which naming the key
# at all would otherwise discard, plus this repo's venv directory name.
norecursedirs = tmp *.egg .* _darcs build CVS dist node_modules venv venv-win {arch}

# `sweep` is the scheduled witness sweep's tier (docs/prompts/WITNESS_SWEEP.md): tests
# of the mutation-witness runner's own lock that cost minutes of wall clock and prove
# nothing a landing can have changed. The default tier deselects them in
# tests/conftest.py; `pytest -q -m sweep` runs exactly them, and so does naming their
# file on the command line.
markers =
    sweep: slow runner-lock tests the scheduled witness sweep owns, deselected from the default tier
